[package]
name = "tap-blitz"
version = "0.1.0"
description = "Tap Blitz — a 30-second tap race on a MagicBlock Ephemeral Rollup (Solana Blitz v10)"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "tap_blitz"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.18.0", features = ["anchor"] }
